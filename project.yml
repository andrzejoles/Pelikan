# Definicja projektu Xcode (XcodeGen). Po zmianie: `make generate`.
name: Pelikan
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PelikanKit:
    path: Packages/PelikanKit
  # Terminal panelu agenta (MIT; jak w Bifoldzie).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Pelikan:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Instrukcja użytkownika (PL-INFRA-010): katalog z rozdziałami Markdown w językach, w zasobach jako „Manual”.
      - path: docs/manual
        name: Manual
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Pelikan.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PelikanKit
        product: PelikanWorkspace
      - package: PelikanKit
        product: PelikanSQL
      - package: PelikanKit
        product: PelikanDB
      - package: PelikanKit
        product: PelikanODPI
      - package: PelikanKit
        product: PelikanThin
      - package: PelikanKit
        product: PelikanAgent
      - package: PelikanKit
        product: PelikanBridgeKit
      - package: PelikanKit
        product: PelikanProC
      - package: PelikanKit
        product: PelikanRemote
      - target: pelikan-mcp
        embed: true
        copy:
          destination: executables
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
  # Most MCP agentów (stdio ↔ gniazdo Unix aplikacji) — w pakiecie aplikacji obok pliku wykonywalnego.
  pelikan-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Packages/PelikanKit/Sources/pelikan-mcp
    settings:
      base:
        PRODUCT_NAME: pelikan-mcp
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: PelikanKit
        product: PelikanBridgeKit
schemes:
  Pelikan:
    build:
      targets:
        Pelikan: all
      preActions:
        - name: Wersja z gita
          script: "\"$SRCROOT/scripts/set-version.sh\""
          settingsTarget: Pelikan
    run:
      config: Debug
    archive:
      config: Release
