# Definicja projektu Xcode (XcodeGen). Po zmianie: `make generate`.
name: Pelikan
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PelikanKit:
    path: Packages/PelikanKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Pelikan:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Pelikan.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PelikanKit
        product: PelikanWorkspace
      - package: PelikanKit
        product: PelikanSQL
      - package: PelikanKit
        product: PelikanDB
      - package: PelikanKit
        product: PelikanODPI
      - package: PelikanKit
        product: PelikanThin
      - package: Sparkle
schemes:
  Pelikan:
    build:
      targets:
        Pelikan: all
      preActions:
        - name: Wersja z gita
          script: "\"$SRCROOT/scripts/set-version.sh\""
          settingsTarget: Pelikan
    run:
      config: Debug
    archive:
      config: Release
