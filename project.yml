# Definicja projektu Xcode (XcodeGen). Po zmianie: `make generate`.
name: Pelikan
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PelikanKit:
    path: Packages/PelikanKit
  # Terminal panelu agenta (MIT; jak w Bifoldzie).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Pelikan:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Instrukcja użytkownika (PL-INFRA-010): katalog z rozdziałami Markdown w językach, w zasobach jako „Manual”.
      - path: docs/manual
        name: Manual
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # Ikona aplikacji (PL-INFRA-012): katalog generowany przez scripts/icon/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Pelikan.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Tłumaczenia nazw w menu Usługi (klucze z nazwą aplikacji po rozwinięciu Brand.xcconfig).
      - name: ServicesMenu.strings
        script: python3 "$SRCROOT/scripts/services-menu.py"
        inputFiles:
          - $(SRCROOT)/scripts/services-menu.py
          - $(SRCROOT)/App/Resources/Localizable.xcstrings
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/ServicesMenu.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/de.lproj/ServicesMenu.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/es.lproj/ServicesMenu.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/uk.lproj/ServicesMenu.strings
    dependencies:
      - package: PelikanKit
        product: PelikanWorkspace
      - package: PelikanKit
        product: PelikanSQL
      - package: PelikanKit
        product: PelikanDB
      - package: PelikanKit
        product: PelikanODPI
      - package: PelikanKit
        product: PelikanThin
      - package: PelikanKit
        product: PelikanAgent
      - package: PelikanKit
        product: PelikanBridgeKit
      - package: PelikanKit
        product: PelikanProC
      - package: PelikanKit
        product: PelikanRemote
      - target: pelikan-mcp
        embed: true
        copy:
          destination: executables
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
      # Podgląd Quick Look plików SQL/PL/SQL (MAC-QL-001) — w Contents/PlugIns.
      - target: PelikanQuickLook
  # Rozszerzenie Quick Look (podgląd oparty na danych: HTML z kolorami składni z PelikanSQL).
  PelikanQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: App/QuickLook
        excludes:
          - Info.plist
          - QuickLook.entitlements
    settings:
      base:
        PRODUCT_NAME: $(PELIKAN_APP_NAME)QuickLook
        PRODUCT_BUNDLE_IDENTIFIER: $(PELIKAN_BUNDLE_ID).quicklook
        INFOPLIST_FILE: App/QuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/QuickLook/QuickLook.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - package: PelikanKit
        product: PelikanSQL
  # Most MCP agentów (stdio ↔ gniazdo Unix aplikacji) — w pakiecie aplikacji obok pliku wykonywalnego.
  pelikan-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Packages/PelikanKit/Sources/pelikan-mcp
    settings:
      base:
        PRODUCT_NAME: pelikan-mcp
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: PelikanKit
        product: PelikanBridgeKit
schemes:
  Pelikan:
    build:
      targets:
        Pelikan: all
      preActions:
        - name: Wersja z gita
          script: "\"$SRCROOT/scripts/set-version.sh\""
          settingsTarget: Pelikan
    run:
      config: Debug
    archive:
      config: Release
