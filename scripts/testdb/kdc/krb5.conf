[libdefaults]
    default_realm = PELIKAN.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 24h
    forwardable = true

[realms]
    PELIKAN.TEST = {
        kdc = 127.0.0.1:88
        admin_server = 127.0.0.1
    }

[domain_realm]
    localhost = PELIKAN.TEST
