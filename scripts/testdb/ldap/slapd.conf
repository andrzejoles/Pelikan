# Serwer LDAP testów nazewnictwa katalogowego (tylko środowisko testowe): odczyt anonimowy, zapis tylko przez
# slapadd przy starcie kontenera (bez konta administratora i bez haseł).
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/oraclenet-min.schema

pidfile /run/openldap/slapd.pid
argsfile /run/openldap/slapd.args
modulepath /usr/lib/openldap
moduleload back_mdb.so

access to * by * read

database mdb
maxsize 10485760
suffix "dc=pelikan,dc=test"
directory /var/lib/openldap/pelikan
index objectClass eq
index cn eq
